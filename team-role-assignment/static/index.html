<style>
  body{margin:0;background:#f8fafc;font-family:'Public Sans',sans-serif;color:#0f172a;}
  .pill-btn{border:none;cursor:pointer;font-weight:700;font-size:12px;padding:8px 14px;border-radius:10px;transition:all .15s;}
  .card2{background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.04);}
  .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;}

  .seg-bar>div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;transition:opacity .15s, transform .15s;cursor:pointer;}
  .seg-bar>div.dim{opacity:.45;}
  .seg-bar>div.hl{transform:scaleY(1.12);}

  .member-card.hl{border-color:var(--mc,#2563eb);background:var(--mbg,#f8fafc);box-shadow:0 4px 12px rgba(15,23,42,.08);}
  .legend-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:10px;font-size:11.5px;font-weight:700;cursor:pointer;transition:box-shadow .15s;}
  .legend-pill.hl{box-shadow:0 0 0 2px var(--mbd,#cbd5e1);}

  button{font-family:inherit;}
  input,textarea,select{font-family:inherit;color:inherit;}

<script>

const HUES = [262, 165, 70, 300, 350, 220, 20, 130];
const COLORS = [
  {hex:'#2563EB', name:'Xanh Lam',  bg:'rgba(37,99,235,0.07)',  border:'rgba(37,99,235,0.4)'},
  {hex:'#059669', name:'Xanh Lục',  bg:'rgba(5,150,105,0.07)',  border:'rgba(5,150,105,0.4)'},

function devColor(dev){ const i = Math.max(0, S.DEVS.findIndex(d=>d.id===dev.id)); return COLORS[i % COLORS.length]; }

const S = {
  stage: 'login', setupStep: 1, analyzeIndex: 0, analyzeError: '',
  user: null, role: 'student',
  page: 'input',                 // input | coach  (khi stage==='app' thì view điều khiển)
  groupId: null, groupStatus: 'Analyzed', coachFeedback: '', createdAt: '',
  groups: [], tickets: [], ticketFilter: 'all',
  ticketModal: false, ticketIssue: '', ticketPriority: 'medium',
  ticketDetail: null, ticketEditStatus: 'pending', ticketEditResponse: '',
  coachModal: false, coachNote: '', coachStatusEdit: 'Analyzed',
  hoverDevId: null, hoverTaskId: null,
  view: 'dashboard', selectedDevId: null, currentUserId: null,
  devSearch: '', devSkillFilter: 'all', difficultyFilter: 'all',
  sortCol: 'difficulty', sortDir: 'desc',
  explainTaskId: null, explainDevId: null,
  setup: null,   // filled below with sample data (editable/removable)
  members: null,
  chatOpen: false, chatInput: '', chatBusy: false,
  chatMessages: [{from:'ai', text:'Xin chào! Hỏi mình về hồ sơ lập trình viên, Task Graph, Bài Lab hoặc phương án phân công nhé.'}],
  // Filled from /api/analyze:
  DEVS: [], TASKS: [], LABS: [], PROJECT: null, FIT_MATRIX: {}, DEFAULT_ASSIGNMENTS: {},
  assignments: {}, warnings: [], workloadNotes: '', SKILL_COVERAGE: [], unassignedTaskIds: [],
};

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

S.members = sampleMembers();

/* ================= Helpers (ported from design) ================= */
function parseDays(str){ const n = parseFloat(str); return String(str).includes('tuần') ? n*7 : n; }

function difficultyStyle(d){
  const map = {
    'Thấp': 'background:oklch(0.93 0.05 175);color:oklch(0.35 0.12 175);',
    'Trung bình': 'background:oklch(0.93 0.05 70);color:oklch(0.4 0.13 70);',
    'Cao': 'background:oklch(0.92 0.06 25);color:oklch(0.45 0.15 25);',
  };
  return 'font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px;' + (map[d]||map['Trung bình']);
}
function fitBadgeStyle(score){
  if (score == null)  // AI chưa chấm cặp này -> xám, không tô màu như điểm thật
    return 'font-size:11px;font-weight:800;padding:3px 8px;border-radius:10px;background:oklch(0.94 0.006 85);color:oklch(0.55 0.01 85);';
  const hue = score >= 88 ? 175 : score >= 75 ? 70 : 25;
  return `font-size:11px;font-weight:800;padding:3px 8px;border-radius:10px;background:oklch(0.93 0.05 ${hue});color:oklch(0.4 0.13 ${hue});`;
}
/* Skill đọc thẳng từ payload backend. Không có bản sao nào bị UI sửa,
   nên con số luôn khớp với skillEvidence tương ứng. */
function devSkills(devId){
  const d = S.DEVS.find(x => x.id === devId);
  return d ? Object.entries(d.skills || {}).map(([name, level]) => ({ name, level: Math.round(level) })) : [];
}
function devEvidence(devId, skillName){
  const d = S.DEVS.find(x => x.id === devId);
  return (d && d.skillEvidence && d.skillEvidence[skillName]) || '';
}
/* Điểm AI cho đúng cặp (task, dev). AI chỉ chấm phương án nó đề xuất,
   nên cặp do người dùng tự kéo sẽ không có điểm — trả null thay vì bịa. */
function aiFit(task, dev){
  return (S.FIT_MATRIX[task.id] && S.FIT_MATRIX[task.id][dev.id]) || null;
}
function computeFit(task, dev){
  const m = aiFit(task, dev);
  const names = devSkills(dev.id).map(s => s.name.toLowerCase());
  const missing = task.skills.filter(s => !names.includes(s.toLowerCase()));
  if (m) return { score: m.score, reason: m.reason, skillsToLearn: m.skillsToLearn || missing, fromAI: true };
  const have = task.skills.length - missing.length;
  return { score: null, fromAI: false, skillsToLearn: missing,
    reason: `Cặp này do bạn tự kéo — AI chưa chấm. Đối chiếu tên kỹ năng: khớp ${have}/${task.skills.length}`
      + (missing.length ? ` · chưa có: ${missing.join(', ')}` : '') + '.' };
}
function buildRadar(skills){
  const R = 85, cx = 110, cy = 110;
  const axes = skills.slice(0, 6);
  const n = Math.max(3, axes.length);
  const angleFor = i => (-90 + i * (360 / n)) * Math.PI / 180;
  const pointsFor = (fn) => axes.map((sk, i) => {
    const ang = angleFor(i); const r = fn(sk) * R;
    return `${cx + r * Math.cos(ang)},${cy + r * Math.sin(ang)}`;
  }).join(' ');
  return { cx, cy,
    valuePoints: pointsFor(sk => sk.level / 100),
    grid100: pointsFor(() => 1), grid75: pointsFor(() => 0.75), grid50: pointsFor(() => 0.5), grid25: pointsFor(() => 0.25),
    axisLines: axes.map((sk, i) => { const a = angleFor(i); return { x2: cx + R * Math.cos(a), y2: cy + R * Math.sin(a) }; }),
    labels: axes.map((sk, i) => { const a = angleFor(i); const lr = R + 18; return { x: cx + lr * Math.cos(a), y: cy + lr * Math.sin(a), name: sk.name }; }),
  };
}
function chipWidth(text, size){ return Math.round(text.length * size * 0.58) + 26; }

function buildFlowGraph(devs, tasks, projectName){
  const COL = { team: 40, member: 210, skill: 520, task: 860, project: 1150 };
  const skillSet = []; const skillOwners = {};
  devs.forEach((d, di) => devSkills(d.id).forEach(sk => {
    if (sk.level <= 0) return;
    if (!skillOwners[sk.name]) { skillOwners[sk.name] = []; skillSet.push(sk.name); }
    skillOwners[sk.name].push({ devIdx: di, level: sk.level });
  }));
  const skillNeeders = {};
  tasks.forEach((t, ti) => t.skills.forEach(sn => {
    if (!skillOwners[sn]) { skillOwners[sn] = []; skillSet.push(sn); }
    (skillNeeders[sn] = skillNeeders[sn] || []).push(ti);
  }));
  const H = Math.max(skillSet.length * 46, devs.length * 96, tasks.length * 74) + 40;
  const yFor = (i, n) => 40 + (H - 80) * (n === 1 ? 0.5 : i / (n - 1));
  const memberY = devs.map((d, i) => yFor(i, devs.length));
  const skillOrdered = [...skillSet].sort((a, b) => {
    const key = n => { const own = skillOwners[n];
      return own.length ? own.reduce((acc, o) => acc + memberY[o.devIdx], 0) / own.length : H / 2 + 1e3; };
    return key(a) - key(b);
  });
  const skillY = {};
  skillOrdered.forEach((n, i) => { skillY[n] = yFor(i, skillOrdered.length); });
  const taskOrdered = tasks.map((t, i) => ({ t, i })).sort((a, b) => {
    const key = o => { const ys = o.t.skills.map(sn => skillY[sn]).filter(v => v != null);
      return ys.length ? ys.reduce((x, y) => x + y, 0) / ys.length : H / 2; };
    return key(a) - key(b);
  });
  const taskY = {};
  taskOrdered.forEach((o, i) => { taskY[o.t.id] = yFor(i, taskOrdered.length); });
  const curve = (x1, y1, x2, y2) => { const mx = (x1 + x2) / 2; return `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`; };
  const memberNodes = devs.map((d, i) => {
    const w = chipWidth(d.name, 12.5);
    return { id: d.id, name: d.name, initials: d.initials,
      x: COL.member, y: memberY[i] - 17, w, h: 34,
      textX: COL.member + w / 2, textY: memberY[i] + 4.5,
      cy: memberY[i], rightX: COL.member + w, leftX: COL.member,
      fill: `oklch(0.94 0.05 ${d.hue})`, stroke: `oklch(0.55 0.13 ${d.hue})`, textFill: `oklch(0.3 0.13 ${d.hue})`,
      haloX: COL.member - 6, haloY: memberY[i] - 23, haloW: w + 12, haloH: 46 };
  });
  const skillNodes = skillOrdered.map(name => {
    const owners = skillOwners[name] || [];
    const best = owners.length ? Math.max(...owners.map(o => o.level)) : 0;
    const w = chipWidth(name, 12);
    const needed = !!skillNeeders[name];
    const gap = needed && owners.length === 0;
    return { name, x: COL.skill - w / 2, y: skillY[name] - 15, w, h: 30,
      textX: COL.skill, textY: skillY[name] + 4,
      leftX: COL.skill - w / 2, rightX: COL.skill + w / 2, cy: skillY[name],
      fill: gap ? 'oklch(0.96 0.04 55)' : 'oklch(0.98 0.005 85)',
      stroke: gap ? 'oklch(0.7 0.13 55)' : 'oklch(0.8 0.01 85)',
      textFill: gap ? 'oklch(0.45 0.14 55)' : 'oklch(0.3 0.01 85)',
      levelLabel: owners.length ? `${Math.round(best)}%` : 'thiếu',
      levelX: COL.skill + w / 2 + 8, levelY: skillY[name] + 4,
      levelFill: gap ? 'oklch(0.55 0.14 55)' : 'oklch(0.55 0.01 85)' };
  });
  const taskNodes = taskOrdered.map(o => {
    const w = chipWidth(o.t.name, 12.5);
    return { id: o.t.id, name: o.t.name,
      x: COL.task, y: taskY[o.t.id] - 17, w, h: 34,
      textX: COL.task + w / 2, textY: taskY[o.t.id] + 4.5,
      leftX: COL.task, rightX: COL.task + w, cy: taskY[o.t.id] };
  });
  const memberEdges = [];
  devs.forEach((d, di) => devSkills(d.id).forEach(sk => {
    if (sk.level <= 0 || skillY[sk.name] == null) return;
    memberEdges.push({
      d: curve(memberNodes[di].rightX, memberY[di], COL.skill - chipWidth(sk.name, 12) / 2, skillY[sk.name]),
      stroke: `oklch(0.62 0.13 ${d.hue})`, strokeWidth: 1 + sk.level / 30, opacity: 0.35 + sk.level / 250 });
  }));
  const taskEdges = [];
  taskNodes.forEach(tn => {
    const task = tasks.find(t => t.id === tn.id);
    task.skills.forEach(sn => {
      if (skillY[sn] == null) return;
      taskEdges.push({ d: curve(COL.skill + chipWidth(sn, 12) / 2, skillY[sn], tn.leftX, tn.cy),
        stroke: 'oklch(0.62 0.1 262)', strokeWidth: 1.6, opacity: 0.4 });
    });
  });
  const teamRoot = { x: COL.team, y: H / 2 - 24, w: 118, h: 48, textX: COL.team + 59, textY: H / 2 + 5, rightX: COL.team + 118, cy: H / 2 };
  const projectRoot = { x: COL.project, y: H / 2 - 30, w: 150, h: 60, textX: COL.project + 75, textY: H / 2 - 2, subY: H / 2 + 16, leftX: COL.project, cy: H / 2 };
  const rootEdges = memberNodes.map(m => ({
    d: curve(teamRoot.rightX, teamRoot.cy, m.leftX, m.cy),
    stroke: 'oklch(0.72 0.02 85)', strokeWidth: 1.4, opacity: 0.6 }))
  .concat(taskNodes.map(t => ({
    d: curve(t.rightX, t.cy, projectRoot.leftX, projectRoot.cy),
    stroke: 'oklch(0.72 0.02 85)', strokeWidth: 1.4, opacity: 0.6 })));
  return { viewBox: `0 0 1320 ${H}`, height: H,
    headers: [
      { label: 'NHÓM', x: COL.team + 59 }, { label: 'THÀNH VIÊN', x: COL.member + 60 },
      { label: 'KỸ NĂNG', x: COL.skill }, { label: 'VẤN ĐỀ / ĐẦU VIỆC', x: COL.task + 70 },
      { label: 'DỰ ÁN', x: COL.project + 75 } ],
    teamRoot, projectRoot, memberNodes, skillNodes, taskNodes,
    edges: rootEdges.concat(memberEdges, taskEdges) };
}

/* ================= App actions ================= */
const App = {
  set(k, v){ S[k] = v; render(); },

  /* ---- auth & role ---- */
  login(role){
    S.user = role === 'coach'
      ? { name: 'Lab Coach', role: 'coach', dept: 'Người hướng dẫn lab' }
      : { name: 'Học viên Team B2', role: 'student', dept: 'Vin AI — Khóa 3' };
    S.role = role;
    S.stage = role === 'coach' ? 'coach' : 'setup';
    if (role === 'coach') App.loadCoachData();
    render();
  },
  logout(){ S.user = null; S.role = 'student'; S.stage = 'login'; render(); },
  switchRole(role){
    if (!S.user) return;
    S.role = role; S.user.role = role;
    if (role === 'coach') { S.stage = 'coach'; App.loadCoachData(); }
    else { S.stage = S.DEVS.length ? 'app' : 'setup'; }
    render();
  },

  /* ---- coach dashboard data ---- */
  async loadCoachData(){
    try {
      const [gr, tk] = await Promise.all([
        fetch('/api/groups').then(r=>r.json()),
        fetch('/api/tickets').then(r=>r.json()),
      ]);
      S.groups = Array.isArray(gr) ? gr : [];
      S.tickets = Array.isArray(tk) ? tk : [];
      render();
    } catch(e) { /* server offline */ }
  },
  async openGroup(id){
    try {
      const data = await fetch('/api/groups/' + id).then(r=>r.json());
      if (data.error) { alert(data.error); return; }
      App.applyPayload(data);
      S.stage = 'app'; S.view = 'dashboard'; render();
      App.loadGroupTickets();
    } catch(e) { alert('Lỗi tải nhóm: ' + e.message); }
  },
  applyPayload(data){
    S.DEVS = data.devs; S.TASKS = data.tasks; S.LABS = data.labs; S.PROJECT = data.project;
    S.FIT_MATRIX = data.fitMatrix; S.DEFAULT_ASSIGNMENTS = { ...data.assignments };
    S.assignments = { ...data.assignments };
    S.warnings = data.warnings || []; S.workloadNotes = data.workloadNotes || '';
    S.SKILL_COVERAGE = data.skillCoverage || [];
    S.unassignedTaskIds = data.unassignedTaskIds || [];
    S.groupId = data.groupId || null; S.groupStatus = data.status || 'Analyzed';
    S.coachFeedback = data.coachFeedback || ''; S.createdAt = data.createdAt || '';
    S.selectedDevId = S.DEVS.length ? S.DEVS[0].id : null;
    S.currentUserId = S.DEVS.length ? S.DEVS[0].id : null;
  },
  backToCoach(){ S.stage = 'coach'; App.loadCoachData(); render(); },

  /* ---- tickets ---- */
  async loadGroupTickets(){
    if (!S.groupId) return;
    try {
      S.tickets = await fetch('/api/tickets?group_id=' + S.groupId).then(r=>r.json());
      render();
    } catch(e) {}
  },
  openTicketModal(){ S.ticketModal = true; S.ticketIssue = ''; S.ticketPriority = 'medium'; render(); },
  closeTicketModal(){ S.ticketModal = false; render(); },
  async submitTicket(){
    const issue = (document.getElementById('ticket-issue')||{}).value || S.ticketIssue;
    if (!issue.trim()) { alert('Nhập mô tả vấn đề trước khi gửi.'); return; }
    const me = S.DEVS.find(d=>d.id===S.currentUserId);
    try {
      const resp = await fetch('/api/tickets', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ groupId: S.groupId || '', studentName: me ? me.name : (S.user?S.user.name:''),
          labName: S.PROJECT ? S.PROJECT.name : '', issue, priority: S.ticketPriority }) });
      const data = await resp.json();
      if (data.error) throw new Error(data.error);
      S.ticketModal = false;
      await App.loadGroupTickets();
      if (S.role === 'coach') await App.loadCoachData();
      S.view = 'tickets'; render();
    } catch(e) { alert('Gửi ticket lỗi: ' + e.message); }
  },
  openTicketDetail(id){
    const t = S.tickets.find(x=>x.id===id); if (!t) return;
    S.ticketDetail = t; S.ticketEditStatus = t.status; S.ticketEditResponse = t.coachResponse || '';
    render();
  },
  closeTicketDetail(){ S.ticketDetail = null; render(); },
  async saveTicketDetail(){
    if (!S.ticketDetail) return;
    const resp = (document.getElementById('ticket-response')||{}).value ?? S.ticketEditResponse;
    try {
      await fetch('/api/tickets/' + S.ticketDetail.id, { method:'PATCH', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ status: S.ticketEditStatus, coachResponse: resp }) });
      S.ticketDetail = null;
      if (S.role === 'coach' && S.stage === 'coach') await App.loadCoachData(); else await App.loadGroupTickets();
      render();
    } catch(e) { alert('Lưu ticket lỗi: ' + e.message); }
  },
  async toggleTicket(ev, id){
    if (ev) ev.stopPropagation();
    const t = S.tickets.find(x=>x.id===id); if (!t) return;
    const next = t.status === 'resolved' ? 'pending' : 'resolved';
    try {
      await fetch('/api/tickets/' + id, { method:'PATCH', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ status: next }) });
      t.status = next; render();
    } catch(e) {}
  },

  /* ---- coach feedback on group ---- */
  openCoachModal(){ S.coachModal = true; S.coachNote = S.coachFeedback; S.coachStatusEdit = S.groupStatus; render(); },
  closeCoachModal(){ S.coachModal = false; render(); },
  async saveCoachFeedback(){
    const note = (document.getElementById('coach-note')||{}).value ?? S.coachNote;
    try {
      await fetch('/api/groups/' + S.groupId, { method:'PATCH', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ status: S.coachStatusEdit, coachFeedback: note }) });
      S.groupStatus = S.coachStatusEdit; S.coachFeedback = note; S.coachModal = false; render();
    } catch(e) { alert('Lưu đánh giá lỗi: ' + e.message); }
  },
  async persistAssignments(){
    if (!S.groupId) return;
    try {
      await fetch('/api/groups/' + S.groupId, { method:'PATCH', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ assignments: S.assignments }) });
    } catch(e) {}
  },

  /* ---- hover sync (task cards <-> workload bar) — DOM trực tiếp, KHÔNG re-render để khỏi giật ---- */
  hoverDev(id){ S.hoverDevId = id; S.hoverTaskId = null; applyHover(); },
  hoverTask(taskId, devId){ S.hoverTaskId = taskId; S.hoverDevId = devId || null; applyHover(); },
  hoverClear(){ S.hoverDevId = null; S.hoverTaskId = null; applyHover(); },
  setTicketFilter(v){ S.ticketFilter = v; render(); },
  setCoachTab(v){ S.page = v; render(); },
  setSetup(field, v){ S.setup[field] = v; },
  setMember(i, field, v){
    S.members[i][field] = (field === 'readiness' || field === 'experienceYears') ? Number(v) : v;
  },
  setReadinessLabel(i, v){
    S.members[i].readiness = Number(v);
    const el = document.getElementById('readiness-label-' + i);
    if (el) el.textContent = 'Sẵn sàng học công nghệ mới: ' + v + '/10';
  },
  addMember(){ if (S.members.length < 8) { S.members.push(emptyMember()); render(); } },
  fillSample(){
    S.setup = { ...sampleSetup() };
    S.members = sampleMembers();
    S.analyzeError = '';
    render();
  },
  removeMember(i){ if (S.members.length > 1) { S.members.splice(i, 1); render(); } },
  goStep(n){ S.setupStep = n; render(); },

  async submitSetup(){
    const filled = S.members.filter(m => (m.name || '').trim() || (m.github || '').trim());
    if (!filled.length) { alert('Cần ít nhất 1 thành viên (tên hoặc GitHub username).'); return; }
    S.stage = 'analyzing'; S.analyzeIndex = 0; S.analyzeError = ''; render();
    const timer = setInterval(() => {
      if (S.analyzeIndex < ANALYZE_LABELS.length - 1) { S.analyzeIndex++; render(); }
    }, 2600);
    try {
      const resp = await fetch('/api/analyze', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ setup: S.setup, members: filled }),
      });
      const data = await resp.json();
      clearInterval(timer);
      if (!resp.ok || data.error) throw new Error(data.error || ('HTTP ' + resp.status));
      App.applyPayload(data);
      S.analyzeIndex = ANALYZE_LABELS.length; render();
      App.loadGroupTickets();
      setTimeout(() => { S.stage = 'app'; S.view = 'dashboard'; render(); }, 420);
    } catch (e) {
      clearInterval(timer);
      S.stage = 'setup'; S.setupStep = 1; S.analyzeError = String(e.message || e); render();
    }
  },

  backToSetup(){ S.stage = 'setup'; S.setupStep = 1; render(); },
  setView(v){ S.view = v; render(); },
  selectDev(id){ S.selectedDevId = id; render(); },
  setDevSearch(v){ S.devSearch = v; render(); },
  setSkillFilter(v){ S.devSkillFilter = v; render(); },
  setDifficultyFilter(v){ S.difficultyFilter = v; render(); },
  setSort(col){ if (S.sortCol === col) S.sortDir = S.sortDir === 'asc' ? 'desc' : 'asc'; else { S.sortCol = col; S.sortDir = 'desc'; } render(); },
  selectUser(v){ S.currentUserId = v; render(); },
  resetAssignments(){ S.assignments = { ...S.DEFAULT_ASSIGNMENTS }; App.persistAssignments(); render(); },
  claimTask(id){ S.assignments[id] = S.currentUserId; App.persistAssignments(); render(); },
  releaseTask(id){ S.assignments[id] = null; App.persistAssignments(); render(); },

  allowDrop(e){ e.preventDefault(); },
  dragStart(e, taskId){ e.dataTransfer.setData('text/plain', taskId); },
  dropOnPool(e){ e.preventDefault(); const id = e.dataTransfer.getData('text/plain'); if (id) { S.assignments[id] = null; App.persistAssignments(); render(); } },
  dropOnDev(e, devId){ e.preventDefault(); const id = e.dataTransfer.getData('text/plain'); if (id) { S.assignments[id] = devId; App.persistAssignments(); render(); } },

  openExplain(e, taskId, devId){ if (e) e.stopPropagation(); S.explainTaskId = taskId; S.explainDevId = devId; render(); },
  closeExplain(){ S.explainTaskId = null; S.explainDevId = null; render(); },

  toggleChat(){ S.chatOpen = !S.chatOpen; render(); },
  setChatInput(v){ S.chatInput = v; },
  chatKey(e){ if (e.key === 'Enter') { S.chatInput = e.target.value; App.sendChat(); } },

  async sendChat(){
    const input = document.getElementById('chat-input');
    const text = ((input && input.value) || S.chatInput || '').trim();
    if (!text || S.chatBusy) return;
    S.chatInput = ''; S.chatBusy = true;
    S.chatMessages.push({from:'user', text});
    render();
    try {
      const summary = {
        project: S.PROJECT ? { name: S.PROJECT.name, type: S.PROJECT.type, techStack: S.PROJECT.techStack } : null,
        devs: S.DEVS.map(d => ({ name: d.name, role: d.roleSuited, skills: devSkills(d.id), githubStats: d.githubStats, wantLearn: d.wantLearn, readiness: d.readiness })),
        assignments: Object.entries(S.assignments).map(([tid, devId]) => {
          const t = S.TASKS.find(x => x.id === tid); const d = S.DEVS.find(x => x.id === devId);
          const fit = d ? computeFit(t, d) : null;
          return { task: t ? t.name : tid, dev: d ? d.name : null, fit: fit ? fit.score : null, reason: fit ? fit.reason : null };
        }),
        skillCoverage: S.SKILL_COVERAGE,
        unassignedTasks: S.unassignedTaskIds.map(id => (S.TASKS.find(t=>t.id===id)||{}).name).filter(Boolean),
        workloadNotes: S.workloadNotes,
      };
      const resp = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ message: text, state_summary: JSON.stringify(summary) }) });
      const data = await resp.json();
      S.chatMessages.push({from:'ai', text: data.reply || data.error || 'Lỗi không rõ.'});
    } catch (e) {
      S.chatMessages.push({from:'ai', text: 'Lỗi gọi server: ' + e.message});
    }
    S.chatBusy = false; render();
    const box = document.getElementById('chat-scroll'); if (box) box.scrollTop = box.scrollHeight;
  },
};

/* Fit trung bình trên các việc người này ĐANG được giao và AI đã chấm.
   Trước đây lấy max trên MỌI task kể cả việc không phải của họ -> luôn ra số cao vô nghĩa. */
function devAssignedFit(dev){
  const s = S.TASKS.filter(t => S.assignments[t.id] === dev.id)
    .map(t => (aiFit(t, dev) || {}).score).filter(v => typeof v === 'number');
  return s.length ? Math.round(s.reduce((a, b) => a + b, 0) / s.length) : null;
}
function fitText(score){ return score == null ? '—' : score + '%'; }

function renderSkillCoverage(){
  if (!S.SKILL_COVERAGE.length) return '';
  const stMap = {
    'có':    { bg:'oklch(0.93 0.05 175)', fg:'oklch(0.33 0.12 175)', label:'✓ Nhóm có' },
    'gần có':{ bg:'oklch(0.95 0.05 70)',  fg:'oklch(0.42 0.12 70)',  label:'≈ Gần có' },
    'thiếu': { bg:'oklch(0.95 0.05 25)',  fg:'oklch(0.45 0.14 25)',  label:'✕ Thiếu' },
  };
  const order = {'thiếu':0,'gần có':1,'có':2};
  const rows = [...S.SKILL_COVERAGE].sort((a,b)=>(order[a.status]??3)-(order[b.status]??3)).map(c => {
    const st = stMap[c.status] || stMap['thiếu'];
    return `<div style="display:grid;grid-template-columns:170px 92px 1fr;gap:12px;padding:10px 4px;border-bottom:1px solid oklch(0.95 0.005 85);align-items:start;font-size:12.5px;">
      <div style="font-weight:700;">${esc(c.skill)}</div>
      <div><span style="font-size:11px;font-weight:800;padding:3px 9px;border-radius:10px;background:${st.bg};color:${st.fg};white-space:nowrap;">${st.label}</span></div>
      <div style="color:oklch(0.4 0.01 85);line-height:1.45;">
        ${c.covered_by.length ? c.covered_by.map(n=>`<span style="display:inline-block;background:oklch(0.95 0.02 262);color:oklch(0.38 0.1 262);font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:11px;margin:1px 4px 1px 0;">${esc(n)}</span>`).join('') : ''}
        ${c.note ? `<div style="margin-top:3px;font-size:12px;color:oklch(0.5 0.01 85);">${esc(c.note)}</div>` : ''}
      </div>
    </div>`;
  }).join('');
  return `<div style="${card}border-radius:16px;padding:22px;margin-top:20px;">
    <div style="font-family:'Sora',sans-serif;font-weight:700;font-size:16px;">Dự án cần gì — ai trong nhóm có?</div>
    <div style="font-size:12.5px;color:oklch(0.5 0.01 85);margin:4px 0 12px;">AI so khớp theo ngữ nghĩa (VD: JavaScript/HTML che được việc dựng UI). Skill "thiếu" là rủi ro cần bàn trước khi chốt phân công.</div>
    <div style="display:grid;grid-template-columns:170px 92px 1fr;gap:12px;font-size:11.5px;color:oklch(0.5 0.01 85);padding:0 4px 8px;border-bottom:1px solid oklch(0.9 0.006 85);">
      <div>Kỹ năng dự án cần</div><div>Trạng thái</div><div>Ai có / nền tảng gần nhất / gợi ý</div></div>
    ${rows}
  </div>`;
}

  const dir = S.sortDir === 'asc' ? 1 : -1;
  const filters = ['all','Thấp','Trung bình','Cao'].map(df =>
    `<button style="border:1px solid ${S.difficultyFilter===df?'oklch(0.56 0.15 262)':'oklch(0.9 0.006 85)'};background:${S.difficultyFilter===df?'oklch(0.93 0.03 262)':'oklch(0.995 0.003 85)'};color:${S.difficultyFilter===df?'oklch(0.4 0.13 262)':'oklch(0.4 0.01 85)'};font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:14px;cursor:pointer;" onclick="App.setDifficultyFilter('${df}')">${df==='all'?'Tất cả':df}</button>`).join('');
  const sortBtn = (col,label) =>
    `<button style="border:1px solid oklch(0.9 0.006 85);background:${S.sortCol===col?'oklch(0.93 0.03 262)':'oklch(0.995 0.003 85)'};color:${S.sortCol===col?'oklch(0.4 0.13 262)':'oklch(0.4 0.01 85)'};font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:14px;cursor:pointer;" onclick="App.setSort('${col}')">${label}${S.sortCol===col?(S.sortDir==='asc'?' ↑':' ↓'):''}</button>`;

  // LABS và TASKS là 1:1 (mỗi task sinh ra đúng 1 "Lab") -> chỉ hiển thị task,
  // mô tả dài lấy từ lab tương ứng. Không dựng lại thành hai danh sách trùng nhau.
  const descOf = (t) => (S.LABS.find(l => l.id === t.labId) || {}).description || '';

  const shown = S.TASKS.filter(t => S.difficultyFilter === 'all' || t.difficulty === S.difficultyFilter)
    .sort((a,b) => ((S.sortCol==='difficulty' ? DIFF_RANK[a.difficulty]-DIFF_RANK[b.difficulty]
                                              : parseDays(a.time)-parseDays(b.time)) * dir));

  const cards = shown.map(t => {
    const dev = S.DEVS.find(dd => dd.id === S.assignments[t.id]);
    const fit = dev ? computeFit(t, dev) : null;
    const unassignedByAI = S.unassignedTaskIds.includes(t.id);
    const skillChips = t.skills.map(sn => {
      const owner = S.DEVS.find(dd => devSkills(dd.id).some(x => x.name.toLowerCase() === sn.toLowerCase()));
      const ok = !!owner;
      return `<span title="${ok ? esc(owner.name + ' có kỹ năng này') : 'Chưa ai trong nhóm khai kỹ năng này'}" style="background:${ok?'oklch(0.93 0.03 262)':'oklch(0.96 0.04 55)'};color:${ok?'oklch(0.4 0.13 262)':'oklch(0.45 0.13 55)'};font-size:11px;font-weight:600;padding:4px 10px;border-radius:14px;">${esc(sn)}${ok?'':' ⚠'}</span>`;
    }).join('');
    return `<div style="${card}border-radius:14px;padding:18px;margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;">
        <div style="flex:1;min-width:260px;">
          <div style="font-weight:700;font-size:14.5px;">${esc(t.name)}</div>
          ${descOf(t) ? `<div style="font-size:12.5px;color:oklch(0.5 0.01 85);margin-top:4px;max-width:620px;line-height:1.5;">${esc(descOf(t))}</div>` : ''}
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;">${skillChips}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
          <div style="display:flex;gap:8px;align-items:center;">
            <span style="${difficultyStyle(t.difficulty)}">${t.difficulty}</span>
            <span style="font-size:12px;color:oklch(0.5 0.01 85);">${esc(t.time)}</span>
          </div>
          ${dev ? `<div style="display:flex;align-items:center;gap:7px;">
              <div style="${avatarStyle(dev.hue,24,10)}">${esc(dev.initials)}</div>
              <span style="font-size:12.5px;font-weight:600;">${esc(dev.name)}</span>
              <span style="${fitBadgeStyle(fit.score)}">${fitText(fit.score)}</span></div>`
            : `<span style="font-size:12px;font-weight:700;color:${unassignedByAI?'oklch(0.5 0.15 25)':'oklch(0.55 0.01 85)'};">${unassignedByAI?'AI không giao được':'Chưa phân công'}</span>`}
        </div>
      </div>
      ${dev && fit ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid oklch(0.95 0.005 85);font-size:12.5px;color:oklch(0.4 0.01 85);line-height:1.5;">${esc(fit.reason)}</div>` : ''}
      ${dev && fit && fit.skillsToLearn.length ? `<div style="margin-top:8px;font-size:12px;color:oklch(0.45 0.11 55);">Cần học thêm: <strong>${esc(fit.skillsToLearn.join(', '))}</strong></div>` : ''}
    </div>`;
  }).join('') || '<div style="padding:26px;text-align:center;font-size:13px;color:oklch(0.55 0.01 85);">Không có đầu việc nào khớp bộ lọc.</div>';

  const totalDays = S.TASKS.reduce((a,t) => a + (t.estimateDays || 0), 0);
  const doneAssign = S.TASKS.filter(t => S.assignments[t.id]).length;

  return `<div>
    <div style="margin-bottom:18px;">
      <div style="font-family:'Sora',sans-serif;font-weight:700;font-size:26px;">Luồng 2 — Đầu việc của bài lab</div>
      <div style="font-size:14px;color:oklch(0.5 0.01 85);margin-top:4px;">AI đọc README + tài liệu repo rồi tách thành đầu việc. Tổng quan dự án xem ở tab <strong>Tóm tắt bài lab</strong>.</div>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
      <div style="${card}border-radius:12px;padding:14px 18px;">
        <div style="font-family:'Sora',sans-serif;font-weight:700;font-size:19px;">${S.TASKS.length}</div>
        <div style="font-size:11.5px;color:oklch(0.5 0.01 85);">đầu việc</div></div>
      <div style="${card}border-radius:12px;padding:14px 18px;">
        <div style="font-family:'Sora',sans-serif;font-weight:700;font-size:19px;">${doneAssign}/${S.TASKS.length}</div>
        <div style="font-size:11.5px;color:oklch(0.5 0.01 85);">đã có người</div></div>
      <div style="${card}border-radius:12px;padding:14px 18px;">
        <div style="font-family:'Sora',sans-serif;font-weight:700;font-size:19px;">${totalDays % 1 === 0 ? totalDays : totalDays.toFixed(1)}</div>
        <div style="font-size:11.5px;color:oklch(0.5 0.01 85);">ngày ước lượng</div></div>
      <div style="${card}border-radius:12px;padding:14px 18px;">
        <div style="font-family:'Sora',sans-serif;font-weight:700;font-size:19px;">${p.modules.length}</div>
        <div style="font-size:11.5px;color:oklch(0.5 0.01 85);">module</div></div>
    </div>
    ${p.modules.length ? `<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px;">${p.modules.map(m=>`<span style="background:oklch(0.96 0.006 85);border:1px solid oklch(0.92 0.006 85);font-size:12px;font-weight:600;padding:5px 12px;border-radius:14px;">${esc(m)}</span>`).join('')}</div>` : ''}
    <div style="display:flex;justify-content:flex-end;gap:6px;margin-bottom:12px;flex-wrap:wrap;">
      ${filters}<span style="width:10px;"></span>${sortBtn('difficulty','Độ khó')}${sortBtn('time','Thời gian')}
    </div>
    ${cards}
    ${renderSkillCoverage()}
  </div>`;
}

function renderMatching(){
  const pool = S.TASKS.filter(t => !S.assignments[t.id]).map(t =>
    `<div draggable="true" ondragstart="App.dragStart(event,'${t.id}')" onclick="App.openExplain(event,'${t.id}',null)" style="${card}border-radius:10px;padding:12px;margin-bottom:10px;cursor:grab;">
      <div style="font-weight:700;font-size:13px;">${esc(t.name)}</div>
      <div style="font-size:11px;color:oklch(0.5 0.01 85);margin-top:4px;">${esc(t.skills.join(', '))}</div>
      <div style="margin-top:8px;"><span style="${difficultyStyle(t.difficulty)}">${t.difficulty}</span></div>
    </div>`).join('');
  const lanes = S.DEVS.map(d => {
    const laneTasks = S.TASKS.filter(t => S.assignments[t.id] === d.id);
    const cards = laneTasks.map(t => {
      const fit = computeFit(t, d);
      return `<div draggable="true" ondragstart="App.dragStart(event,'${t.id}')" onclick="App.openExplain(event,'${t.id}','${d.id}')" style="background:oklch(0.98 0.003 85);border:1px solid oklch(0.9 0.006 85);border-radius:10px;padding:12px;margin-bottom:10px;cursor:grab;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div style="font-weight:700;font-size:13px;">${esc(t.name)}</div>
          <div style="${fitBadgeStyle(fit.score)}">${fit.score}%</div></div>
        <div style="font-size:11px;color:oklch(0.5 0.01 85);margin-top:4px;">${esc(t.skills.join(', '))}</div>
        <div style="margin-top:8px;"><span style="${difficultyStyle(t.difficulty)}">${t.difficulty}</span></div>
      </div>`;
    }).join('');
    const days = laneTasks.reduce((a,t)=>a+(t.estimateDays||0),0);
    return `<div style="flex:0 0 240px;${card}border-radius:14px;padding:14px;min-height:420px;" ondragover="App.allowDrop(event)" ondrop="App.dropOnDev(event,'${d.id}')">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
        <div style="${avatarStyle(d.hue,26,10.5)}">${esc(d.initials)}</div>
        <div style="font-weight:700;font-size:13px;">${esc(d.name)}</div></div>
      <div style="font-size:11px;color:oklch(0.5 0.01 85);margin-bottom:12px;">${laneTasks.length} việc · ${days % 1 === 0 ? days : days.toFixed(1)} ngày · Fit TB ${fitText(devAssignedFit(d))}</div>
      ${cards}</div>`;
  }).join('');
  const rows = Object.entries(S.assignments).filter(([,devId]) => devId).map(([taskId, devId]) => {
    const task = S.TASKS.find(t => t.id === taskId);
    const dev = S.DEVS.find(d => d.id === devId);
    const fit = computeFit(task, dev);
    return { devName: dev.name, taskName: task.name, fit };
  }).sort((a,b) => (b.fit.score ?? -1) - (a.fit.score ?? -1)).map(r =>
    `<div style="display:grid;grid-template-columns:150px 170px 90px 1fr;gap:0;padding:12px 4px;border-bottom:1px solid oklch(0.95 0.005 85);align-items:start;font-size:12.5px;">
      <div style="font-weight:700;">${esc(r.devName)}</div><div>${esc(r.taskName)}</div>
      <div><span style="${fitBadgeStyle(r.fit.score)}">${fitText(r.fit.score)}</span></div>
      <div style="color:oklch(0.4 0.01 85);line-height:1.45;">${esc(r.fit.reason)}
        ${r.fit.skillsToLearn.length ? `<div style="margin-top:3px;color:oklch(0.45 0.11 55);">Cần học thêm: <strong>${esc(r.fit.skillsToLearn.join(', '))}</strong></div>` : ''}</div></div>`).join('');
  const unassigned = S.unassignedTaskIds
    .map(id => (S.TASKS.find(t => t.id === id) || {}).name).filter(Boolean);
  const banner = unassigned.length ? `<div style="background:oklch(0.96 0.04 25);border:1px solid oklch(0.82 0.09 25);border-radius:12px;padding:13px 16px;font-size:12.5px;color:oklch(0.42 0.14 25);margin-bottom:16px;">
      <strong>AI không giao được ${unassigned.length} đầu việc</strong> (không ai đủ phù hợp): ${esc(unassigned.join(' · '))}. Cần bàn lại phạm vi hoặc cử người học.</div>` : '';
  const notes = S.workloadNotes ? `<div style="background:oklch(0.96 0.02 262);border:1px solid oklch(0.87 0.05 262);border-radius:12px;padding:13px 16px;font-size:12.5px;color:oklch(0.35 0.1 262);margin-bottom:16px;">
      <strong>Ghi chú workload của AI:</strong> ${esc(S.workloadNotes)}</div>` : '';
  return `<div>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
      <div>
        <div style="font-family:'Sora',sans-serif;font-weight:700;font-size:26px;">Luồng 3 — Matching Developer × Task</div>
        <div style="font-size:14px;color:oklch(0.5 0.01 85);margin-top:4px;">Kéo thả để chỉnh phân công. Nhấn vào thẻ để xem lý do AI đưa ra. Cặp bạn tự kéo sẽ không có Fit Score vì AI chưa chấm cặp đó.</div>
      </div>
      <button style="background:oklch(0.56 0.15 262);color:oklch(0.98 0.01 262);border:none;border-radius:10px;padding:11px 18px;font-size:13px;font-weight:700;cursor:pointer;" onclick="App.resetAssignments()">Về phân bổ AI đề xuất</button>
    </div>
    ${banner}${notes}
    <div style="display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;margin-bottom:26px;">
      <div style="flex:0 0 240px;background:oklch(0.96 0.006 85);border:1px dashed oklch(0.82 0.008 85);border-radius:14px;padding:14px;min-height:420px;" ondragover="App.allowDrop(event)" ondrop="App.dropOnPool(event)">
        <div style="font-weight:700;font-size:13px;margin-bottom:4px;">Chưa phân công</div>
        <div style="font-size:11px;color:oklch(0.5 0.01 85);margin-bottom:12px;">${S.TASKS.filter(t=>!S.assignments[t.id]).length} việc</div>
        ${pool}</div>
      ${lanes}
    </div>
    <div style="${card}border-radius:16px;padding:22px;">
      <div style="font-family:'Sora',sans-serif;font-weight:700;font-size:16px;margin-bottom:14px;">Kết quả phân công & lý do</div>
      <div style="display:grid;grid-template-columns:150px 170px 90px 1fr;gap:0;font-size:12px;color:oklch(0.5 0.01 85);padding:0 4px 10px;border-bottom:1px solid oklch(0.9 0.006 85);">
        <div>Thành viên</div><div>Công việc</div><div>Fit Score</div><div>Lý do phân công</div></div>
      ${rows}
    </div></div>`;
}

function renderClaim(){
  const me = S.DEVS.find(d => d.id === S.currentUserId) || S.DEVS[0];
  const open = S.TASKS.filter(t => !S.assignments[t.id]).map(t => {
    const fit = computeFit(t, me);
    return `<div style="border:1px solid oklch(0.92 0.006 85);border-radius:12px;padding:14px;margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <div style="font-weight:700;font-size:13.5px;">${esc(t.name)}</div>
        <div style="${fitBadgeStyle(fit.score)}">${fitText(fit.score)}</div></div>
      <div style="font-size:12px;color:oklch(0.5 0.01 85);margin-top:5px;">${esc(t.skills.join(', '))} · ${esc(t.time)}</div>
      <div style="font-size:12px;color:${fit.skillsToLearn.length?'oklch(0.45 0.11 55)':'oklch(0.4 0.11 175)'};margin-top:5px;">${fit.skillsToLearn.length ? 'Sẽ phải học thêm: ' + esc(fit.skillsToLearn.join(', ')) : 'Bạn đã có đủ kỹ năng yêu cầu'}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:11px;">
        <span style="${difficultyStyle(t.difficulty)}">${t.difficulty}</span>
        <button style="background:oklch(0.56 0.15 262);color:oklch(0.98 0.01 262);border:none;border-radius:9px;padding:9px 16px;font-size:12.5px;font-weight:700;cursor:pointer;" onclick="App.claimTask('${t.id}')">Nhận việc này</button>
      </div></div>`;
  }).join('') || `<div style="padding:26px;text-align:center;font-size:13px;color:oklch(0.55 0.01 85);">Không còn đầu việc trống — mọi việc đã có người nhận.</div>`;
  const mine = S.TASKS.filter(t => S.assignments[t.id] === S.currentUserId).map(t => {
    const fit = computeFit(t, me);
    return `<div style="border:1px solid oklch(0.92 0.006 85);border-radius:12px;padding:14px;margin-bottom:10px;background:oklch(0.98 0.003 85);">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <div style="font-weight:700;font-size:13.5px;">${esc(t.name)}</div>
        <div style="${fitBadgeStyle(fit.score)}">${fitText(fit.score)}</div></div>
      <div style="font-size:12px;color:oklch(0.5 0.01 85);margin-top:5px;">${esc(t.skills.join(', '))} · ${esc(t.time)}</div>
      ${fit.skillsToLearn.length ? `<div style="font-size:12px;color:oklch(0.45 0.11 55);margin-top:5px;">Cần học thêm: ${esc(fit.skillsToLearn.join(', '))}</div>` : ''}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:11px;">
        <span style="${difficultyStyle(t.difficulty)}">${t.difficulty}</span>
        <button style="background:oklch(0.98 0.003 85);border:1px solid oklch(0.88 0.006 85);border-radius:9px;padding:9px 14px;font-size:12.5px;font-weight:600;cursor:pointer;" onclick="App.releaseTask('${t.id}')">Trả lại việc</button>
      </div></div>`;
  }).join('') || `<div style="padding:26px;text-align:center;font-size:13px;color:oklch(0.55 0.01 85);">Bạn chưa nhận việc nào.</div>`;
  return `<div>
    <div style="margin-bottom:20px;">
      <div style="font-family:'Sora',sans-serif;font-weight:700;font-size:26px;">Nhận việc</div>
      <div style="font-size:14px;color:oklch(0.5 0.01 85);margin-top:4px;">Bạn đang xem với vai trò <strong style="color:oklch(0.3 0.01 85);">${esc(me.name)}</strong>. Chọn đầu việc còn trống để nhận, hoặc trả lại việc đang giữ.</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;">
      <div style="${card}border-radius:16px;padding:22px;">
        <div style="font-family:'Sora',sans-serif;font-weight:700;font-size:16px;margin-bottom:4px;">Việc còn trống</div>
        <div style="font-size:12.5px;color:oklch(0.5 0.01 85);margin-bottom:14px;">Fit Score chỉ hiện khi AI đã chấm bạn với việc đó.</div>
        ${open}</div>
      <div style="${card}border-radius:16px;padding:22px;">
        <div style="font-family:'Sora',sans-serif;font-weight:700;font-size:16px;margin-bottom:4px;">Việc của tôi</div>
        <div style="font-size:12.5px;color:oklch(0.5 0.01 85);margin-bottom:14px;">Thay đổi ở đây được lưu lại cho cả nhóm và Lab Coach.</div>
        ${mine}</div>
    </div></div>`;
}

function renderExplain(){
  if (!S.explainTaskId) return '';
  const task = S.TASKS.find(t => t.id === S.explainTaskId);
  let devName = 'Chưa phân công', score = '', reason = 'Đầu việc này chưa được gán cho thành viên nào. Kéo thẻ vào một lane để xem lý do phân công.', breakdown = '', skillMatch = '';
  if (S.explainDevId) {
    const dev = S.DEVS.find(dd => dd.id === S.explainDevId);
    const fit = computeFit(task, dev);
    devName = dev.name; score = fitText(fit.score); reason = fit.reason;
    if (fit.skillsToLearn.length)
      breakdown = `<div style="background:oklch(0.97 0.03 55);border:1px solid oklch(0.85 0.07 55);border-radius:10px;padding:12px 14px;font-size:12.5px;color:oklch(0.42 0.12 55);">
        <strong>Cần học thêm để làm được việc này:</strong><br>${esc(fit.skillsToLearn.join(', '))}</div>`;
    // Đối chiếu từng kỹ năng task cần với mức thật của người này + bằng chứng.
    const skills = devSkills(dev.id);
    skillMatch = task.skills.map(sk => {
      const found = skills.find(x => x.name.toLowerCase() === sk.toLowerCase());
      const level = found ? found.level : 0;
      const ev = found ? devEvidence(dev.id, found.name) : '';
      return `<div style="margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;"><span>${esc(sk)}</span><span style="color:${found?'oklch(0.5 0.01 85)':'oklch(0.55 0.13 55)'};">${found ? level + '%' : 'Chưa có'}</span></div>
        <div style="height:6px;background:oklch(0.93 0.006 85);border-radius:4px;overflow:hidden;"><div style="height:100%;border-radius:4px;width:${level}%;background:${level>0?'oklch(0.56 0.15 262)':'oklch(0.85 0.01 85)'};"></div></div>
        ${ev?`<div style="font-size:11px;color:oklch(0.55 0.01 85);margin-top:3px;">${esc(ev)}</div>`:''}
      </div>`;
    }).join('');
  } else {
    skillMatch = task.skills.map(sk => `<div style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;"><span>${esc(sk)}</span><span style="color:oklch(0.5 0.01 85);">—</span></div>
      <div style="height:6px;background:oklch(0.93 0.006 85);border-radius:4px;overflow:hidden;"><div style="height:100%;border-radius:4px;width:0%;"></div></div></div>`).join('');
  }
  return `<div style="position:fixed;inset:0;background:oklch(0.2 0.01 85 / 0.35);z-index:40;display:flex;justify-content:flex-end;" onclick="App.closeExplain()">

function applyHover(){
  const dev = S.hoverDevId, task = S.hoverTaskId;
  document.querySelectorAll('[data-hv]').forEach(el => {
    const match = (dev && el.getAttribute('data-dev') === dev)
               || (task && el.getAttribute('data-task') === task);
    el.classList.toggle('hl', !!match);
    if (el.parentElement && el.parentElement.classList.contains('seg-bar'))
      el.classList.toggle('dim', !!dev && !match);
  });
}
function workloadShares(){
  const per = {}; S.DEVS.forEach(d => per[d.id] = 0);
  let total = 0;
  Object.entries(S.assignments).forEach(([tid, did]) => {
    if (!did) return;
    const t = S.TASKS.find(x=>x.id===tid); const days = t ? (t.estimateDays||0) : 0;
    total += days; per[did] = (per[did]||0) + days;
  });
  const shares = {};
  S.DEVS.forEach(d => shares[d.id] = total > 0 ? Math.round(per[d.id]/total*100) : 0);
  let balance = 0;
  if (total > 0 && S.DEVS.length) {
    const vals = S.DEVS.map(d => per[d.id]/total);
    const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
    const cv = mean ? Math.sqrt(vals.reduce((a,v)=>a+(v-mean)*(v-mean),0)/vals.length)/mean : 1;
    balance = Math.max(0, Math.round(100*(1-cv)));
  }
  return { shares, balance, totalDays: total };
}
function avgFitScore(){
  const assigned = Object.entries(S.assignments).filter(([,v])=>v);
  if (!assigned.length) return 0;
  return Math.round(assigned.reduce((acc,[tid,did])=>{
    const t = S.TASKS.find(x=>x.id===tid), d = S.DEVS.find(x=>x.id===did);
    return acc + (t && d ? computeFit(t,d).score : 0); }, 0) / assigned.length);
}
function statusTag(st){
  const map = { 'Approved':['#dcfce7','#15803d','✓ Coach đã phê duyệt'],
    'Needs Revision':['#fee2e2','#b91c1c','⚠ Yêu cầu phân công lại'],
    'Analyzed':['#fef9c3','#a16207','Phân tích AI'] };
  const [bg,fg,label] = map[st] || map['Analyzed'];
  return `<span style="background:${bg};color:${fg};font-size:11px;font-weight:800;padding:4px 10px;border-radius:8px;">${label}</span>`;
}
function balanceRing(value, size){
  size = size || 58; const sw = 6, r = (size-sw)/2, c = 2*Math.PI*r;
  const off = c - (value/100)*c;
  const color = value > 70 ? '#10b981' : value >= 50 ? '#f59e0b' : '#ef4444';
  return `<div style="position:relative;width:${size}px;height:${size}px;flex:0 0 auto;">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg);">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#e2e8f0" stroke-width="${sw}" fill="none"></circle>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${sw}" fill="none"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" stroke-linecap="round"></circle>
    </svg>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:${color};">${value}%</div>
  </div>`;
}

      <div style="display:flex;align-items:center;gap:10px;">
        <div style="position:relative;flex:0 0 auto;">
          <div style="width:40px;height:40px;border-radius:50%;background:${col.bg};border:2px solid ${col.hex};color:${col.hex};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;">${esc(d.initials)}</div>
          <span style="position:absolute;bottom:-4px;right:-6px;background:${col.hex};color:#fff;font-size:9px;font-weight:800;border-radius:8px;padding:1px 5px;">${ws.shares[d.id]||0}%</span>

        <div style="flex:1;min-width:0;">

      ${myTasks.length ? `<div style="margin-top:9px;display:flex;flex-direction:column;gap:5px;">${myTasks.map(t=>`<div style="background:#f8fafc;border:1px solid #f1f5f9;border-radius:9px;padding:7px 9px;font-size:11.5px;"><strong>📍 ${esc(t.name)}</strong> <span style="color:#64748b;">· ${esc(t.time)}</span></div>`).join('')}</div>`
        : `<div style="margin-top:9px;font-size:11.5px;color:#94a3b8;font-style:italic;">Chưa nhận việc nào</div>`}

  return `<div style="display:grid;grid-template-columns:6fr 4fr;gap:18px;align-items:start;">
    <div class="card2" style="padding:20px;">
      <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:15.5px;">Mô tả công việc & Highlight thành viên</div>
      <div style="font-size:12px;color:#64748b;margin:3px 0 14px;">Rê chuột vào từng phần việc để xem ai phụ trách (tô màu theo thành viên). Nhấn để xem giải thích của AI.</div>
      <div style="display:flex;flex-direction:column;gap:11px;">${taskCards}</div>
    </div>
    <div class="card2" style="padding:20px;">
      <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:15.5px;">Tỉ lệ phân công công việc</div>
      <div style="font-size:12px;color:#64748b;margin:3px 0 12px;">Thanh màu = % khối lượng (theo ngày công ước tính) của từng thành viên.</div>
      <div class="seg-bar">${segs || '<div style="width:100%;background:#e2e8f0;color:#64748b;">Chưa có phân công</div>'}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;">${legend}</div>
      <div style="font-size:10.5px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px;">Danh sách thành viên & nhiệm vụ</div>
      <div style="display:flex;flex-direction:column;gap:9px;">${memberCards}</div>
    </div>
  </div>`;
}

      <span>Quy mô: <strong style="color:#0f172a;">${esc(p.scale)}</strong></span>

      ${esc(p.summary || p.description || 'Chưa có tóm tắt — hãy chạy phân tích với repo có README.')}

      ${p.sourcesRead.map(f=>`<span style="display:inline-block;background:#d1fae5;color:#047857;font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;margin:2px 4px 2px 0;">📄 ${esc(f)}</span>`).join('')}</div>` : ''}

function renderTicketList(isCoach){
  const filtered = S.ticketFilter === 'all' ? S.tickets : S.tickets.filter(t=>t.status===S.ticketFilter);
  const pills = [['all','Tất cả ('+S.tickets.length+')','#0f172a','#fff'],
    ['pending','Chưa xong ('+S.tickets.filter(t=>t.status==='pending').length+')','#fff','#f59e0b'],
    ['resolved','Đã xong ('+S.tickets.filter(t=>t.status==='resolved').length+')','#fff','#059669']]
    .map(([key,label]) => {
      const on = S.ticketFilter===key;
      const bg = key==='all' ? (on?'#fff':'transparent') : key==='pending' ? (on?'#f59e0b':'transparent') : (on?'#059669':'transparent');
      const fg = key==='all' ? '#0f172a' : on ? '#fff' : '#475569';
      return `<button class="pill-btn" style="background:${bg};color:${fg};${on&&key==='all'?'box-shadow:0 1px 2px rgba(15,23,42,.1);':''}" onclick="App.setTicketFilter('${key}')">${label}</button>`;
    }).join('');
  const items = filtered.length ? filtered.map(t => {
    const done = t.status === 'resolved';
    return `<div onclick="App.openTicketDetail('${t.id}')" style="border:1px solid ${done?'#a7f3d0':'#e2e8f0'};background:${done?'rgba(209,250,229,.25)':'#fff'};border-radius:16px;padding:15px 17px;cursor:pointer;display:flex;gap:13px;align-items:flex-start;transition:all .15s;">
      ${isCoach ? `<button title="${done?'Chuyển về Chưa xong':'Đánh dấu Đã xong'}" onclick="App.toggleTicket(event,'${t.id}')"
        style="flex:0 0 auto;width:30px;height:30px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;border:1px solid ${done?'#059669':'#cbd5e1'};background:${done?'#10b981':'#f1f5f9'};color:${done?'#fff':'#94a3b8'};">✓</button>` : ''}
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;">
          <span style="font-family:monospace;font-weight:800;font-size:11px;color:#4338ca;background:#eef2ff;border:1px solid #c7d2fe;padding:2px 8px;border-radius:7px;">#${esc(t.id)}</span>
          ${t.labName?`<span style="background:#f3e8ff;color:#7c3aed;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:7px;">${esc(t.labName)}</span>`:''}
          ${t.priority==='high'?'<span style="background:#fee2e2;color:#b91c1c;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:7px;">Gấp</span>':''}
        </div>
        <div style="font-size:12.5px;font-weight:600;color:${done?'#64748b':'#1e293b'};margin-top:6px;line-height:1.5;${done?'text-decoration:line-through;':''}">"${esc(t.issue)}"</div>
        <div style="display:flex;gap:10px;font-size:11px;color:#64748b;margin-top:6px;flex-wrap:wrap;">
          <span>👤 <strong>${esc(t.studentName||'—')}</strong></span>
          ${t.groupId?`<span style="font-family:monospace;color:#4f46e5;font-weight:700;">Nhóm #${esc(t.groupId)}</span>`:''}
          <span>🕐 ${esc(t.createdAt)}</span>
        </div>
        ${t.coachResponse?`<div style="margin-top:7px;background:#eef2ff;border:1px solid #e0e7ff;border-radius:9px;padding:7px 10px;font-size:11.5px;color:#3730a3;"><strong>💬 Coach:</strong> ${esc(t.coachResponse)}</div>`:''}
      </div>
      <div style="flex:0 0 auto;">${done
        ? '<span style="background:#dcfce7;color:#15803d;font-size:11px;font-weight:800;padding:4px 10px;border-radius:8px;">✓ Đã xong</span>'
        : '<span style="background:#ffedd5;color:#c2410c;font-size:11px;font-weight:800;padding:4px 10px;border-radius:8px;">⏳ Chưa xong</span>'}</div>
    </div>`;
  }).join('') : `<div style="text-align:center;padding:40px;color:#94a3b8;background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;font-size:13px;">Không có ticket nào trong danh mục này.</div>`;
  return { pills, items };
}

  const header = `<div class="card2" style="padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;">
    <div>
      <div style="display:flex;align-items:center;gap:8px;">

      <div><div style="font-size:11.5px;color:#64748b;font-weight:700;">${label}</div>

    const stats = `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px;">

      ${stat('Trung bình (50–70%)', S.groups.filter(g=>g.balanceRatio>=50&&g.balanceRatio<=70).length + ' Nhóm', '#d97706','#fef3c7','📈')}
      ${stat('Cần điều chỉnh (<50%)', S.groups.filter(g=>g.balanceRatio<50).length + ' Nhóm', '#dc2626','#fee2e2','⚠')}
    </div>`;
    const groupCards = S.groups.length ? S.groups.map((g, idx) => `
      <div class="card2" style="padding:16px;cursor:pointer;transition:all .15s;" onclick="App.openGroup('${g.id}')"
        onmouseenter="this.style.boxShadow='0 6px 18px rgba(15,23,42,.1)'" onmouseleave="this.style.boxShadow=''">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-family:monospace;font-weight:800;font-size:11px;color:#1d4ed8;background:#dbeafe;padding:3px 9px;border-radius:7px;">#${esc(g.id)}</span>

        <div style="font-weight:800;font-size:13.5px;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(g.projectName || g.repoUrl || 'Nhóm chưa đặt tên')}</div>
        <div style="font-size:11px;color:#94a3b8;margin-top:2px;">${esc(g.createdAt)} · ${g.taskCount} module</div>
        <div style="display:flex;align-items:center;justify-content:space-between;background:#f8fafc;border:1px solid #f1f5f9;border-radius:12px;padding:10px 12px;margin-top:10px;">

        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid #f1f5f9;margin-top:10px;padding-top:9px;font-size:11.5px;font-weight:800;color:#4f46e5;">

    body = `${stats}
      <div class="card2" style="padding:20px;margin-top:16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding-bottom:12px;border-bottom:1px solid #f1f5f9;margin-bottom:14px;">
          <div>
            <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:15.5px;">Danh sách nhóm đã phân tích</div>
            <div style="font-size:12px;color:#64748b;">Nhấp vào một nhóm để xem phân công chi tiết, radar kỹ năng và đánh giá.</div>
          </div>
          <div style="display:flex;gap:12px;font-size:11.5px;font-weight:700;">
            <span style="color:#059669;">● &gt;70%</span><span style="color:#d97706;">● 50–70%</span><span style="color:#dc2626;">● &lt;50%</span>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;">${groupCards}</div>
      </div>`;
  } else {
    const { pills, items } = renderTicketList(true);
    body = `<div class="card2" style="padding:22px;margin-top:16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid #f1f5f9;margin-bottom:16px;">
        <div>
          <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:16px;">🛟 Danh sách tickets hỗ trợ từ học viên</div>
          <div style="font-size:12px;color:#64748b;margin-top:2px;">Nhấp dấu tích để đánh dấu xong nhanh, hoặc nhấp vào ticket để xem chi tiết và phản hồi.</div>
        </div>
        <div style="background:#f1f5f9;padding:4px;border-radius:12px;display:flex;gap:2px;">${pills}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;">${items}</div>
    </div>`;
  }
  return `<div style="max-width:1280px;margin:0 auto;padding:24px 24px 60px;" class="fadeIn">${header}${body}</div>`;
}

      <div style="margin-top:14px;"><div style="font-size:12px;font-weight:800;margin-bottom:5px;">Mức độ ưu tiên:</div>
        <div style="display:flex;gap:6px;">
          ${[['low','Thấp'],['medium','Trung bình'],['high','Gấp']].map(([v,l])=>`<button class="pill-btn" style="background:${S.ticketPriority===v?'#4f46e5':'#f1f5f9'};color:${S.ticketPriority===v?'#fff':'#475569'};" onclick="App.set('ticketPriority','${v}')">${l}</button>`).join('')}
        </div></div>
      <div style="margin-top:14px;"><div style="font-size:12px;font-weight:800;margin-bottom:5px;">Mô tả vấn đề cần hỗ trợ:</div>
        <textarea id="ticket-issue" rows="4" placeholder="Mô tả chi tiết khó khăn, thắc mắc hoặc sự cố gặp phải..." style="width:100%;padding:11px 13px;border-radius:12px;border:1px solid #cbd5e1;font-size:12.5px;outline:none;resize:vertical;">${esc(S.ticketIssue)}</textarea></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
        <button class="pill-btn" style="background:#f1f5f9;color:#475569;padding:10px 16px;" onclick="App.closeTicketModal()">Hủy</button>
        <button class="pill-btn" style="background:#4f46e5;color:#fff;padding:10px 18px;" onclick="App.submitTicket()">Gửi Ticket</button>
      </div>
    </div></div>`;
}

function renderTicketDetailModal(){
  if (!S.ticketDetail) return '';
  const t = S.ticketDetail;
  const isCoach = S.role === 'coach';
  return `<div class="modal-mask" onclick="App.closeTicketDetail()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:17px;">🛟 Chi tiết Ticket #${esc(t.id)}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-top:14px;font-size:12px;">
        <div><span style="color:#64748b;font-weight:700;display:block;">Học viên yêu cầu:</span><span style="font-weight:800;">${esc(t.studentName||'—')}</span></div>
        <div><span style="color:#64748b;font-weight:700;display:block;">Mã nhóm:</span><span style="font-family:monospace;font-weight:800;color:#4f46e5;">#${esc(t.groupId||'—')}</span></div>
        <div><span style="color:#64748b;font-weight:700;display:block;">Bài lab:</span><span style="font-weight:700;">${esc(t.labName||'—')}</span></div>
        <div><span style="color:#64748b;font-weight:700;display:block;">Thời gian:</span><span>${esc(t.createdAt)}</span></div>
      </div>
      <div style="margin-top:14px;"><div style="font-size:12px;font-weight:800;margin-bottom:5px;">Mô tả vấn đề từ học viên:</div>
        <div style="background:#0f172a;color:#e2e8f0;border-radius:12px;padding:13px 15px;font-size:12.5px;line-height:1.6;">${esc(t.issue)}</div></div>
      ${isCoach ? `
      <div style="margin-top:14px;"><div style="font-size:12px;font-weight:800;margin-bottom:5px;">Trạng thái ticket:</div>
        <div style="display:flex;gap:6px;">
          <button class="pill-btn" style="background:${S.ticketEditStatus==='pending'?'#f59e0b':'#f1f5f9'};color:${S.ticketEditStatus==='pending'?'#fff':'#475569'};" onclick="App.set('ticketEditStatus','pending')">⏳ Chưa xong</button>
          <button class="pill-btn" style="background:${S.ticketEditStatus==='resolved'?'#059669':'#f1f5f9'};color:${S.ticketEditStatus==='resolved'?'#fff':'#475569'};" onclick="App.set('ticketEditStatus','resolved')">✓ Đã xong</button>
        </div></div>
      <div style="margin-top:14px;"><div style="font-size:12px;font-weight:800;margin-bottom:5px;">Phản hồi & hướng giải quyết của Lab Coach:</div>
        <textarea id="ticket-response" rows="4" placeholder="Nhập hướng dẫn giải quyết sự cố hoặc phản hồi cho học viên..." style="width:100%;padding:11px 13px;border-radius:12px;border:1px solid #cbd5e1;font-size:12.5px;outline:none;resize:vertical;">${esc(S.ticketEditResponse)}</textarea></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
        <button class="pill-btn" style="background:#f1f5f9;color:#475569;padding:10px 16px;" onclick="App.closeTicketDetail()">Hủy</button>
        <button class="pill-btn" style="background:#4f46e5;color:#fff;padding:10px 18px;" onclick="App.saveTicketDetail()">Lưu & cập nhật ticket</button>
      </div>`
      : `${t.coachResponse ? `<div style="margin-top:14px;"><div style="font-size:12px;font-weight:800;margin-bottom:5px;">💬 Phản hồi từ Lab Coach:</div>
          <div style="background:#eef2ff;border:1px solid #c7d2fe;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#3730a3;line-height:1.6;">${esc(t.coachResponse)}</div></div>`
        : '<div style="margin-top:14px;font-size:12.5px;color:#94a3b8;font-style:italic;">Coach chưa phản hồi ticket này.</div>'}
      <div style="display:flex;justify-content:flex-end;margin-top:16px;">
        <button class="pill-btn" style="background:#f1f5f9;color:#475569;padding:10px 16px;" onclick="App.closeTicketDetail()">Đóng</button>
      </div>`}
    </div></div>`;
}

function renderCoachModal(){
  if (!S.coachModal) return '';
  return `<div class="modal-mask" onclick="App.closeCoachModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:17px;">💬 Đánh giá & phê duyệt nhóm (Lab Coach)</div>
      <div style="margin-top:14px;"><div style="font-size:12px;font-weight:800;margin-bottom:5px;">Trạng thái phê duyệt:</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${[['Approved','✓ Đã phê duyệt','#059669'],['Needs Revision','⚠ Yêu cầu phân công lại','#dc2626'],['Analyzed','Đang xem xét','#a16207']].map(([v,l,c])=>
            `<button class="pill-btn" style="background:${S.coachStatusEdit===v?c:'#f1f5f9'};color:${S.coachStatusEdit===v?'#fff':'#475569'};" onclick="App.set('coachStatusEdit','${v}')">${l}</button>`).join('')}
        </div></div>
      <div style="margin-top:14px;"><div style="font-size:12px;font-weight:800;margin-bottom:5px;">Nhận xét & hướng dẫn cho nhóm:</div>
        <textarea id="coach-note" rows="4" placeholder="VD: Nhóm nên bổ sung phần test cho Module 4, Bằng hỗ trợ Tâm phần Streamlit..." style="width:100%;padding:11px 13px;border-radius:12px;border:1px solid #cbd5e1;font-size:12.5px;outline:none;resize:vertical;">${esc(S.coachNote)}</textarea></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
        <button class="pill-btn" style="background:#f1f5f9;color:#475569;padding:10px 16px;" onclick="App.closeCoachModal()">Hủy</button>
        <button class="pill-btn" style="background:#059669;color:#fff;padding:10px 18px;" onclick="App.saveCoachFeedback()">Lưu nhận xét & phê duyệt</button>
      </div>
    </div></div>`;
}

let LAST_ANIM_KEY = '';
function gateAnim(html){
  // fadeIn chỉ chạy khi đổi màn hình — vẽ lại cùng màn (mở modal, chat, kéo thả) thì bỏ để khỏi giật
  const key = S.stage + '|' + S.view + '|' + S.page;
  const changed = key !== LAST_ANIM_KEY;
  LAST_ANIM_KEY = key;
  return changed ? html : html.split('fadeIn').join('');
}

function render(){
  const root = document.getElementById('root');
  if (S.stage === 'login') { root.innerHTML = gateAnim(renderLogin()); return; }
  if (S.stage === 'coach') {
    root.innerHTML = gateAnim(`<div style="min-height:100vh;">${renderNavbar()}${renderCoach()}${renderTicketDetailModal()}${renderTicketModal()}</div>`);
    return;
  }
  if (S.stage === 'setup') { root.innerHTML = gateAnim(`<div>${renderNavbar()}${renderSetup()}</div>`); return; }
  if (S.stage === 'analyzing') { root.innerHTML = gateAnim(renderAnalyzing()); return; }
  const viewHtml = S.view === 'dashboard' ? renderDashboard()
    : S.view === 'summary' ? renderSummaryTab()
    : S.view === 'developers' ? renderDevelopers()
    : S.view === 'graph' ? renderGraph()
    : S.view === 'project' ? renderProject()
    : S.view === 'matching' ? renderMatching()
    : S.view === 'tickets' ? renderTicketsTab()
    : renderClaim();
  root.innerHTML = gateAnim(`<div style="min-height:100vh;display:flex;flex-direction:column;">
    ${renderNavbar()}
    ${renderHeader()}
    <div style="flex:1;padding:24px 28px 60px;max-width:1360px;width:100%;margin:0 auto;">${viewHtml}</div>
    ${renderExplain()}${renderChat()}
    ${renderTicketModal()}${renderTicketDetailModal()}${renderCoachModal()}
  </div>`);
  applyHover();
  const box = document.getElementById('chat-scroll'); if (box) box.scrollTop = box.scrollHeight;
}

render();
</script>
</body>
</html>
